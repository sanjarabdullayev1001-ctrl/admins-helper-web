<!-- TELEGRAM WEB CHAT BOSHQARUV PANELI -->
<div class="card" style="margin-top:15px; border-radius:12px; background:#1c242d; color:#fff; padding:15px;">
    <h3>💬 Telegram Jonli Chat (Guruhda yozishish)</h3>
    
    <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
        <!-- 1. Guruh tanlash -->
        <div style="flex:1; min-width:200px;">
            <label style="font-size:12px; color:#8ea3b7;">🏘 Guruhni tanlang:</label>
            <select id="chat-group-select" class="input" style="width:100%; background:#242f3d; color:#fff;" onchange="loadGroupChatMessages()">
                <option value="">Guruhni tanlang...</option>
            </select>
        </div>

        <!-- 2. Kim nomidan yozish -->
        <div style="flex:1; min-width:200px;">
            <label style="font-size:12px; color:#8ea3b7;">👤 Kim nomidan yozish:</label>
            <select id="chat-sender-mode" class="input" style="width:100%; background:#242f3d; color:#fff;" onchange="toggleAccountSelect()">
                <option value="bot">🤖 Bot nomidan</option>
                <option value="account">📱 Ulangan shaxsiy akkaunt nomidan</option>
            </select>
        </div>

        <!-- 3. Akkaunt tanlash (Faqat akkaunt tanlanganda chiqadi) -->
        <div id="account-select-box" style="flex:1; min-width:200px; display:none;">
            <label style="font-size:12px; color:#8ea3b7;">📱 Akkauntni tanlang:</label>
            <select id="chat-account-select" class="input" style="width:100%; background:#242f3d; color:#fff;">
                <option value="">Akkaunt yuklanmoqda...</option>
            </select>
        </div>
    </div>

    <!-- JONLI XABARLAR OYNASI (TELEGRAM CHAT LENTASI) -->
    <div id="telegram-chat-box" style="height:380px; overflow-y:auto; background:#0e1621; border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px;">
        <div style="text-align:center; color:#6c7883; margin-top:150px;">Guruhni tanlang, xabarlar bu yerda jonli ko‘rinadi...</div>
    </div>

    <!-- REPLY QILINAYOTGAN XABARNI KO'RSATISH -->
    <div id="reply-preview-bar" style="display:none; background:#242f3d; padding:6px 12px; border-left:3px solid #5288c1; margin-top:8px; border-radius:4px; font-size:13px; justify-content:space-between; align-items:center;">
        <div>
            <span style="color:#5288c1; font-weight:bold;" id="reply-to-user">@user</span>:
            <span style="color:#aaa;" id="reply-to-text">xabar matni...</span>
        </div>
        <button onclick="cancelReply()" style="background:none; border:none; color:#ff5959; font-size:16px; cursor:pointer;">✕</button>
    </div>

    <!-- XABAR YOZISH VA YUBORISH MAYDONI -->
    <div style="display:flex; gap:8px; margin-top:8px;">
        <input type="text" id="chat-msg-input" class="input" placeholder="Xabarni yoki /command yozing..." style="flex:1; background:#242f3d; color:#fff; border-radius:8px;" onkeydown="if(event.key==='Enter') sendLiveChatMessage()">
        <button class="btn btn-primary" onclick="sendLiveChatMessage()" style="background:#5288c1; border-radius:8px; padding:0 20px;">Yuborish ✈️</button>
    </div>
</div>

<script>
let currentReplyMsgId = 0;
let liveChatInterval = null;

// Ulangan akkauntlarni saytga yuklash
async function loadConnectedAccounts() {
    try {
        const res = await fetch('/api/v2/chat/accounts');
        const data = await res.json();
        const sel = document.getElementById('chat-account-select');
        sel.innerHTML = '';
        if (data.accounts && data.accounts.length > 0) {
            data.accounts.forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc.id;
                opt.textContent = `${acc.name} (${acc.phone || '@' + acc.username})`;
                sel.appendChild(opt);
            });
        } else {
            sel.innerHTML = '<option value="">Ulangan akkauntlar yo‘q</option>';
        }
    } catch(e) { console.error(e); }
}

function toggleAccountSelect() {
    const mode = document.getElementById('chat-sender-mode').value;
    document.getElementById('account-select-box').style.display = (mode === 'account') ? 'block' : 'none';
    if(mode === 'account') loadConnectedAccounts();
}

// Guruh xabarlarini yuklash va jonli ko'rsatish
async function loadGroupChatMessages() {
    const chatId = document.getElementById('chat-group-select').value;
    if(!chatId) return;

    try {
        const res = await fetch('/api/v2/chat');
        const data = await res.json();
        const box = document.getElementById('telegram-chat-box');
        box.innerHTML = '';

        const groupMsgs = (data.messages || []).filter(m => String(m.chat_id) === String(chatId));
        if(groupMsgs.length === 0) {
            box.innerHTML = '<div style="text-align:center; color:#6c7883; margin-top:150px;">Bu guruhda hali xabarlar yo‘q</div>';
            return;
        }

        groupMsgs.forEach(m => {
            const isOutgoing = m.direction === 'outgoing';
            const bubble = document.createElement('div');
            bubble.style.maxWidth = '75%';
            bubble.style.padding = '8px 12px';
            bubble.style.borderRadius = '8px';
            bubble.style.alignSelf = isOutgoing ? 'flex-end' : 'flex-start';
            bubble.style.background = isOutgoing ? '#2b5278' : '#182533';
            bubble.style.cursor = 'pointer';
            bubble.title = "Javob berish (Reply) uchun bosing";
            bubble.onclick = () => setReplyTo(m.id, m.sender, m.text);

            bubble.innerHTML = `
                <div style="font-size:11px; color:#6ab2f2; font-weight:bold;">${m.sender}</div>
                <div style="font-size:14px; margin:3px 0; word-break:break-word;">${m.text}</div>
                <div style="font-size:10px; color:#8294a5; text-align:right;">${m.time.split(' ')[1] || ''}</div>
            `;
            box.appendChild(bubble);
        });

        box.scrollTop = box.scrollHeight;
    } catch(e) { console.error(e); }
}

function setReplyTo(msgId, sender, text) {
    currentReplyMsgId = msgId;
    document.getElementById('reply-to-user').textContent = sender;
    document.getElementById('reply-to-text').textContent = text.substring(0, 35) + '...';
    document.getElementById('reply-preview-bar').style.display = 'flex';
    document.getElementById('chat-msg-input').focus();
}

function cancelReply() {
    currentReplyMsgId = 0;
    document.getElementById('reply-preview-bar').style.display = 'none';
}

// Xabar / Reply / /command yuborish
async function sendLiveChatMessage() {
    const chatId = document.getElementById('chat-group-select').value;
    const text = document.getElementById('chat-msg-input').value.trim();
    const senderMode = document.getElementById('chat-sender-mode').value;
    const accountId = document.getElementById('chat-account-select').value;

    if(!chatId) return alert('Iltimos, guruhni tanlang!');
    if(!text) return;

    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('text', text);
    fd.append('sender_mode', senderMode);
    fd.append('account_id', accountId);
    fd.append('reply_to_msg_id', currentReplyMsgId);

    try {
        const res = await fetch('/api/v2/chat/send', { method: 'POST', body: fd });
        const d = await res.json();
        if(d.ok) {
            document.getElementById('chat-msg-input').value = '';
            cancelReply();
            setTimeout(loadGroupChatMessages, 800);
        } else {
            alert('Xatolik: ' + (d.detail || 'Xabar yuborilmadi'));
        }
    } catch(e) { alert('Tarmoq xatosi: ' + e); }
}

// Avto-yangilanish: Har 3 soniyada xabarlarni jonli yangilab turadi
if(!liveChatInterval) {
    liveChatInterval = setInterval(loadGroupChatMessages, 3000);
}
</script>
