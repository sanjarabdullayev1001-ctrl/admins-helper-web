<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admins Helper Control</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#121a29;--line:#25334a;--red:#f0445e;--muted:#91a0b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3ff;font:15px Arial}header{height:64px;padding:0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#0d1421;position:sticky;top:0}b.logo{color:#ff536b;letter-spacing:2px}button,input,textarea,select{font:inherit;border-radius:9px;border:1px solid var(--line);padding:11px;background:#0c1422;color:#fff}button{cursor:pointer;background:#e83e59;border:0;font-weight:700}button.alt{background:#26344a}button.danger{background:#9d263b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}nav{padding:18px;border-right:1px solid var(--line);background:#0d1421}nav button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:#cbd7eb}nav button.active,nav button:hover{background:#1b2940;color:#fff}main{padding:24px;max-width:1400px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px}.num{font-size:30px;color:#ff657b;font-weight:bold;margin-top:8px}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;overflow:auto}td,th{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#ff8797}input,textarea{width:100%;margin:6px 0 12px}textarea{min-height:90px}a{color:#ff8797}.hidden{display:none}.login{max-width:420px;margin:8vh auto}.pill{padding:4px 8px;border-radius:20px;background:#26344a}.red{color:#ff526b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.feed{max-height:520px;overflow:auto}.msg{padding:10px;border-bottom:1px solid var(--line)}@media(max-width:720px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);gap:5px}nav button{white-space:nowrap;width:auto}.layout main{padding:12px}header{padding:0 12px}}
</style></head><body>
<header><b class="logo">ADMINS HELPER / CONTROL</b><span id="who" class="muted">Web Server</span></header>
<section id="login" class="login card"><h2>Hisobga kirish</h2><p class="muted">Mustaqil Admins Helper web server</p><form id="loginForm"><label>Login</label><input name="username" required><label>Parol</label><input name="password" type="password" required><button>KIRISH</button></form><p id="loginErr" class="red"></p><hr><h3>Yangi hisob</h3><form id="signupForm"><input name="username" placeholder="Login (3-40 belgi)" required><input name="telegram_id" placeholder="Telegram ID" inputmode="numeric" required><input name="password" type="password" placeholder="Parol (kamida 10 belgi)" required><button class="alt">TELEGRAMGA KOD YUBORISH</button></form><form id="verifyForm" class="hidden"><input name="telegram_id" id="verifyTid" placeholder="Telegram ID" inputmode="numeric" required><input name="code" placeholder="6 xonali kod" inputmode="numeric" maxlength="6" required><button class="alt">KODNI TASDIQLASH</button></form><p class="muted">Botni Telegramda ochib /start bosing. Kod 60 soniya amal qiladi. Yangi kod uchun 60 soniyadan keyin qayta so‘rang.</p></section>
<div id="app" class="layout hidden"><nav id="nav"><button data-tab="overview" class="active">📊 Umumiy</button><button data-tab="groups">👥 Guruhlar</button><button data-tab="events">🛡️ Xavfsizlik tarixi</button><button data-tab="applications">📨 Arizalar</button><button data-tab="blacklist">🚫 Qora ro‘yxat</button><button data-tab="chat">✉️ Telegram xabar</button><button data-tab="admins" id="adminNav">👑 Admin panel</button><button id="logout" class="danger">Chiqish</button></nav><main><div id="content"></div></main></div>
<script>
const $=s=>document.querySelector(s);let me=null,tab='overview',groups=[];
async function api(path,opts={}){let r=await fetch(path,{credentials:'same-origin',headers:{...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})},...opts});let d=await r.json().catch(()=>({detail:'Server javobi xato'}));if(!r.ok)throw Error(d.detail||'Xatolik');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showLogin(){ $('#login').classList.remove('hidden');$('#app').classList.add('hidden') }
function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=me.username+' · '+me.role;if(me.role!=='owner')$('#adminNav').classList.add('hidden');else $('#adminNav').classList.remove('hidden');load() }
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target);me=await api('/api/v2/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});showApp()}catch(x){$('#loginErr').textContent=x.message}};
$('#signupForm').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target),v=Object.fromEntries(f);await api('/api/v2/signup/request-code',{method:'POST',body:JSON.stringify(v)});$('#verifyTid').value=v.telegram_id;$('#verifyForm').classList.remove('hidden');$('#loginErr').textContent='Kod yuborish navbatiga qo‘shildi. Botda /start bosilgan bo‘lishi shart.'}catch(x){$('#loginErr').textContent=x.message}};
$('#verifyForm').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target);me=await api('/api/v2/signup/verify',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});showApp()}catch(x){$('#loginErr').textContent=x.message}};
$('#logout').onclick=async()=>{await api('/api/v2/logout',{method:'POST'});me=null;showLogin()};
$('#nav').onclick=e=>{let b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));load()};
async function load(){try{let d=await api('/api/v2/'+tab);render(d)}catch(e){$('#content').innerHTML='<div class="card red">'+esc(e.message)+'</div>'}}
function table(headers,rows){return '<div style="overflow:auto"><table><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows+'</table></div>'}
function render(d){let c=$('#content');
if(tab==='overview'){c.innerHTML='<h1>Dashboard</h1><div class="grid">'+[['Guruhlar',d.groups],['Xabarlar',d.messages],['Hodisalar',d.events],['A’zolar kirishi',d.joins],['A’zolar chiqishi',d.leaves]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="num">'+x[1]+'</div></div>').join('')+'</div><div class="card"><h3>Oxirgi hodisalar</h3>'+table(['Turi','Guruh','Ma’lumot','Vaqt'],(d.recent||[]).map(x=>'<tr><td>'+esc(x.type)+'</td><td>'+esc(x.chat_id)+'</td><td>'+esc(x.summary)+'</td><td>'+esc(x.time)+'</td></tr>').join(''))+'</div>'}
if(tab==='groups'){groups=d.groups||[];c.innerHTML='<h1>Mening guruhlarim</h1><div class="grid">'+groups.map(g=>'<div class="card"><h3>'+esc(g.title)+'</h3><p class="muted">ID: '+esc(g.chat_id)+'</p><div class="num">'+g.members+'</div><p>A’zolar</p><button onclick="openGroup(\''+esc(g.chat_id)+'\')">Guruh tarixi</button></div>').join('')+'</div>'}
if(tab==='events'){c.innerHTML='<h1>Shubhali harakatlar va hodisalar</h1>'+table(['Turi','Guruh','Foydalanuvchi','Tafsilot','Vaqt'],(d.events||[]).map(x=>'<tr><td>'+esc(x.type)+'</td><td>'+esc(x.chat_id)+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.summary)+'</td><td>'+esc(x.time)+'</td></tr>').join(''))}
if(tab==='applications'){c.innerHTML='<h1>Guruh arizalari</h1>'+table(['Guruh','Foydalanuvchi','Holat','Vaqt','Amal'],(d.items||[]).map(x=>'<tr><td>'+esc(x.chat_id)+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.time)+'</td><td><button onclick="appAction('+x.id+',\'accepted\')">Qabul</button> <button class="alt" onclick="appAction('+x.id+',\'rejected\')">Rad</button></td></tr>').join(''))}
if(tab==='blacklist'){c.innerHTML='<h1>Qora ro‘yxat</h1><div class="card"><form id="blockForm" class="row"><input name="telegram_id" placeholder="Telegram ID" required><input name="reason" placeholder="Sabab"><button>Bloklash</button></form></div>'+table(['Telegram ID','Sabab','Vaqt','Amal'],(d.items||[]).map(x=>'<tr><td>'+esc(x.telegram_id)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.time)+'</td><td><button class="alt" onclick="unblock(\''+esc(x.telegram_id)+'\')">Blokdan chiqarish</button></td></tr>').join(''));$('#blockForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await api('/api/v2/blacklist',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});load()}}
if(tab==='chat'){groups=d.groups||[];c.innerHTML='<h1>Telegram — bot nomidan</h1><div class="card"><div class="row"><div><label>Guruhni tanlang</label><select id="chatGroup">'+groups.map(g=>'<option value="'+esc(g.chat_id)+'">'+esc(g.title)+' ('+g.members+')</option>').join('')+'</select></div><div><label>Media turi</label><select id="mediaType"><option value="photo">Rasm</option><option value="video">Video</option><option value="voice">Ovozli xabar (OGG)</option><option value="audio">Audio</option><option value="animation">GIF / animatsiya</option><option value="sticker">WEBP stiker</option><option value="document">Fayl</option></select></div></div><label>Fayl (ixtiyoriy)</label><input id="chatFile" type="file"><label>Xabar / izoh</label><textarea id="chatText" placeholder="Xabar yozing..."></textarea><button onclick="sendChat()">BOT NOMIDAN YUBORISH</button> <span id="sendStatus" class="muted"></span></div><div class="card"><h3>Yuborilgan xabarlar</h3><div class="feed">'+(d.items||[]).map(x=>'<div class="msg"><b>'+esc((groups.find(g=>String(g.chat_id)===String(x.chat_id))||{}).title||x.chat_id)+'</b><p>'+esc(x.text||("["+x.media_type+"]"))+'</p><small class="muted">'+esc(x.status)+' · '+esc(x.time)+' '+esc(x.result||'')+'</small></div>').join('')+'</div></div>'}
if(tab==='admins'){c.innerHTML='<h1>Admin panel</h1><div class="card"><form id="adminForm"><input name="username" placeholder="Login" required><input name="password" type="password" placeholder="Parol (10+)" required><input name="telegram_id" placeholder="Telegram ID"><button>Admin qo‘shish</button></form></div>'+table(['Login','Rol','Holat','Telegram ID','Amal'],(d.items||[]).map(x=>'<tr><td>'+esc(x.username)+'</td><td>'+esc(x.role)+'</td><td>'+esc(x.active?'Faol':'Bloklangan')+'</td><td>'+esc(x.telegram_id)+'</td><td><button class="alt" onclick="toggleAdmin('+x.id+','+(!x.active)+')">'+(x.active?'Bloklash':'Faollashtirish')+'</button></td></tr>').join(''));$('#adminForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await api('/api/v2/admins',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});load()}}
}
window.sendChat=async()=>{const status=$('#sendStatus');status.textContent='Yuborilmoqda...';try{const f=new FormData();f.append('chat_id',$('#chatGroup').value);f.append('text',$('#chatText').value);f.append('media_type',$('#mediaType').value);const file=$('#chatFile').files[0];if(file)f.append('file',file);await api('/api/v2/chat/send',{method:'POST',body:f});$('#chatText').value='';$('#chatFile').value='';status.textContent='Navbatga qo‘shildi. Bot yuborishi kutilmoqda.';setTimeout(load,1500)}catch(e){status.textContent=e.message}};
window.openGroup=async id=>{let d=await api('/api/v2/group/'+encodeURIComponent(id));$('#content').innerHTML='<button class="alt" onclick="tab=\'groups\';load()">← Guruhlar</button><h1>'+esc(d.group.title)+'</h1>'+table(['Turi','Kim','Matn / tafsilot','Vaqt'],d.events.map(x=>'<tr><td>'+esc(x.type)+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.summary)+'</td><td>'+esc(x.time)+'</td></tr>').join(''))}
window.appAction=async(id,status)=>{await api('/api/v2/applications/'+id,{method:'POST',body:JSON.stringify({status})});load()};
window.unblock=async(id)=>{await api('/api/v2/blacklist/'+id,{method:'DELETE'});load()};
window.toggleAdmin=async(id,active)=>{await api('/api/v2/admins/'+id,{method:'PATCH',body:JSON.stringify({active})});load()};
(async()=>{try{me=await api('/api/v2/me');showApp()}catch(e){showLogin()}})();
</script></body></html>
