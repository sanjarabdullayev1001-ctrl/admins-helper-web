name: Validate web app
on:
  push:
    branches:
      - fix/web-database-access-control-2026-11-17
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements_web.txt
      - run: python -m py_compile web_app.py db_backend.py
